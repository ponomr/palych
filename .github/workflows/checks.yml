name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package and generated hosts
        run: python3 scripts/check_package.py
      - name: Adapter, installer and builder tests
        run: python3 -m unittest discover -s adapters -p 'test_*.py'
      - name: Evaluation tooling tests
        run: python3 -m unittest discover -s evals -p 'test_*.py'
